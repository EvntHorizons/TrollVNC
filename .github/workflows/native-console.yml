name: Build native Field Console
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Install packaging tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid-procursus dpkg
      - name: Compile native application
        run: bash native-console/build.sh
      - name: Verify MAVLink protocol fixtures
        run: |
          swiftc native-console/MAVPacket.swift native-console/tests/main.swift -o /tmp/c2-protocol-tests
          /tmp/c2-protocol-tests
      - uses: actions/upload-artifact@v4
        with:
          name: native-field-console
          path: |
            native-console/build/*.deb
            native-console/build/SHA256SUMS
